name: Auto Renew New-Bot-Hosting

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 */2 * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      WORK_DIR: newbothost
    permissions:
      contents: write

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: yeye296/Auto-Renew-Scripts
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 启用 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 配置 DNS 并验证 WARP
        run: |
          set -euo pipefail
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf 2>/dev/null || true
          sleep 3
          # echo "[INFO] DNS 测试:"
          # nslookup dashboard.katabump.com 1.1.1.1 || echo "[WARN] 解析失败"
          # echo ""
          for i in {1..30}; do
            status=$(curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -oP 'warp=\K\w+' || echo unknown)
            [[ "$status" =~ ^(on|plus)$ ]] && echo "WARP 已连接" && break
            echo "WARP 连接中... ($i/30)"
            sleep 2
          done
          echo -n "出口 IP: " && curl -s https://api.ipify.org && echo

      - name: 🚀 运行续期脚本
        timeout-minutes: 15
        working-directory: scripts/${{ env.WORK_DIR }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SESSION_TOKEN: ${{ secrets.NEW_BOT_SESSION_TOKEN }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 上传截图产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          # 👇 仅匹配该目录下的 png 文件
          path: |
            scripts/${{ env.WORK_DIR }}/*.png
            scripts/${{ env.WORK_DIR }}/screenshots/*.png
            # 👇 使用 ** 递归匹配该目录及子目录（如 screenshots/）下的所有 png
            # path: scripts/${{ env.WORK_DIR }}/**/*.png
          if-no-files-found: ignore
          retention-days: 7

